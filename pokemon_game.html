function calcDmg(a,d){
  const e=tEff(a.types,d.types);
  const b=Math.floor((a.attack/(d.defense*0.5+25))*45*(0.85+Math.random()*0.15));
  return{dmg:Math.max(1,Math.floor(b*e)),eff:e};
}

}
function xpBar(p){
  const lv=p.level||1;if(lv>=100)return"";

}

function doExplore(){
  const id=Math.floor(Math.random()*TOTAL)+1;
  const w=buildWild(id);
  if(!S.seen.includes(id)){S.seen.push(id);sv("seen",S.seen);}
  S.wild=w;S.wildHP=w.maxHP;S.playerHP=S.party[0].currentHP;
  S.log=[];S.pendingEvo=null;S.levelUpData=null;
  addLog(`⚡ A wild ${w.name} appeared!`);
  const e=tEff(S.party[0].types,w.types);
  if(e>=2)addLog("✨ Your type is super effective!");
  else if(e>0&&e<1)addLog("😬 Its type resists yours...");
  S.bState="active";S.screen="battle";render();
}

function checkFaint(){
  // Returns true if handled (switched or ended), false if battle continues
  if(S.playerHP>0)return false;
  S.party[0]={...S.party[0],currentHP:0};
  addLog(`😢 ${S.party[0].name} fainted!`);
  const alive=S.party.filter(p=>p.currentHP>0);
  if(alive.length>0){
    addLog("Choose your next Pokémon!");
    saveAll();S.switchCtx="faint";S.screen="switch";
    return true;
  }
  S.bState="fainted";saveAll();
  return true;
}

async function doAtk(){
  if(S.busy||S.bState!=="active")return;
  S.busy=true;render();
  const pl=S.party[0];
  const{dmg,eff}=calcDmg(pl,S.wild);
  S.wildHP=Math.max(0,S.wildHP-dmg);
  addLog(`⚔️ ${pl.name} dealt ${dmg} dmg!${eff>=2?" Super effective!":eff>0&&eff<1?" Not very effective...":eff===0?" No effect!":""}`);
  if(S.wildHP<=0){
    // Win!
    S.balls++;
    const gained=Math.floor((S.wild.level||5)*15*(0.8+Math.random()*0.4));
    let p={...S.party[0],currentHP:S.playerHP};
    p.xp=(p.xp||0)+gained;
    const oldLv=p.level||1;
    p.level=levelFromXP(p.xp);
    addLog(`💀 Wild ${S.wild.name} fainted! +${gained} XP (+1 ball)`);
    if(p.level>oldLv){
      const ns=getStats(p.id);
      const nHP=Math.min(p.maxHP+Math.floor((p.level-oldLv)*2.5), ns.maxHP+30);
      const nAtk=p.attack+Math.floor((p.level-oldLv)*1.5);
      const nDef=p.defense+Math.floor((p.level-oldLv)*1.2);
      S.levelUpData={name:p.name,types:p.types,id:p.id,oldLv,newLv:p.level,oHP:p.maxHP,nHP,oAtk:p.attack,nAtk,oDef:p.defense,nDef};
      p.maxHP=nHP;p.attack=nAtk;p.defense=nDef;
      p.currentHP=Math.min(p.currentHP,nHP);
      const evo=EVOS[p.id];
      if(evo&&p.level>=evo[1])S.pendingEvo={fromName:p.name,toId:evo[0]};
    }
    S.party[0]=p;S.bState="won";saveAll();S.busy=false;
    if(S.levelUpData){S.screen="levelup";}
    render();return;
  }
  render();await delay(480);
  const{dmg:wd,eff:we}=calcDmg(S.wild,pl);
  S.playerHP=Math.max(0,S.playerHP-wd);
  addLog(`💥 Wild ${S.wild.name} dealt ${wd} dmg!${we>=2?" Super effective!":we>0&&we<1?" Not very effective...":""}`);
  S.busy=false;
  if(checkFaint()){render();return;}
  render();
}

async function doCatch(){
  if(S.busy||S.bState!=="active"||S.balls<=0)return;
  S.busy=true;S.balls--;
  addLog(`🎯 Threw a Pokéball! (${S.balls} left)`);render();
  await delay(700);
  const chance=Math.min(0.93,(1-(S.wildHP/S.wild.maxHP)*0.6)*0.75);
  if(Math.random()<chance){
    addLog(`🎉 Gotcha! ${S.wild.name} was caught!`);S.bState="caught";
    if(!S.caught.includes(S.wild.id))S.caught.push(S.wild.id);
    if(!S.seen.includes(S.wild.id))S.seen.push(S.wild.id);
    if(S.party.length<6)S.party.push({...S.wild,currentHP:S.wildHP,xp:0,level:S.wild.level||5});
    S.party[0]={...S.party[0],currentHP:S.playerHP};
    saveAll();S.busy=false;render();return;
  }
  addLog(`💨 ${S.wild.name} broke free!`);
  await delay(280);
  const{dmg}=calcDmg(S.wild,S.party[0]);
  S.playerHP=Math.max(0,S.playerHP-Math.max(1,Math.floor(dmg*0.5)));
  addLog(`💥 ${S.wild.name} attacks for ${Math.max(1,Math.floor(dmg*0.5))} dmg!`);
  sv("balls",S.balls);
  S.busy=false;
  if(checkFaint()){render();return;}
  render();
}

async function doRun(){
  if(S.busy||S.bState!=="active")return;
  S.busy=true;render();await delay(280);
  if(Math.random()>0.3){
    addLog("🏃 Got away safely!");S.bState="ran";
    S.party[0]={...S.party[0],currentHP:S.playerHP};sv("party",S.party);
    S.busy=false;render();return;
  }
  addLog("❌ Can't escape!");
  const{dmg}=calcDmg(S.wild,S.party[0]);
  S.playerHP=Math.max(0,S.playerHP-dmg);
  addLog(`💥 ${S.wild.name} attacks for ${dmg} dmg!`);
  S.busy=false;
  if(checkFaint()){render();return;}
  render();
}

function doHeal(){
  S.party=S.party.map(p=>({...p,currentHP:p.maxHP}));
  sv("party",S.party);render();
}

function doEvolve(){
  if(!S.pendingEvo)return;
  const{toId,fromName}=S.pendingEvo;
  const st=getStats(toId);
  const pl=S.party[0];
  S.party[0]={...pl,id:toId,name:getName(toId),types:getTypes(toId),maxHP:st.maxHP+25,attack:Math.floor(pl.attack*1.2),defense:Math.floor(pl.defense*1.15),currentHP:Math.min(pl.currentHP,st.maxHP+25)};
  addLog(`🎊 ${fromName} evolved into ${S.party[0].name}!`);
  S.pendingEvo=null;S.levelUpData=null;saveAll();S.screen="hub";render();
}

function doSwitch(idx){
  // Swap chosen to index 0
  const tmp=S.party[0];S.party[0]=S.party[idx];S.party[idx]=tmp;
  if(S.switchCtx==="faint"){
    // Free switch after faint
    S.playerHP=S.party[0].currentHP;
    addLog(`🔄 Go, ${S.party[0].name}!`);
    saveAll();S.screen="battle";render();
  } else if(S.switchCtx==="battle"){
    // Wild gets a free hit for switching
    const{dmg}=calcDmg(S.wild,S.party[0]);
    S.playerHP=Math.max(0,S.party[0].currentHP-dmg);
    addLog(`🔄 Go, ${S.party[0].name}!`);
    addLog(`💥 Wild ${S.wild.name} attacks for ${dmg} dmg!`);
    if(checkFaint()){render();return;}
    S.party[0]={...S.party[0],currentHP:S.playerHP};
    saveAll();S.screen="battle";render();
  } else {
    addLog(`🔄 ${S.party[0].name} is now your lead!`);
    saveAll();S.screen="hub";render();
  }
}

// ── EVENTS ────────────────────────────────────────────────────
function bind(){
  const on=(id,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener("click",fn);};

  // Users screen
  document.querySelectorAll("[id^='pu']").forEach(el=>{
    el.addEventListener("click",()=>{
      const u=el.dataset.user;USER=u;
      S.party=ld("party",[]);S.caught=ld("caught",[]);S.seen=ld("seen",[]);S.balls=ld("balls",20);
      S.screen=S.party.length>0?"hub":"title";render();
    });
  });
  document.querySelectorAll(".delu").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(!confirm("Delete "+btn.dataset.user+"'s save?"))return;
      delUser(btn.dataset.user);render();
    });
  });
  const ni=document.getElementById("ni");
  const addUser=()=>{
    const name=(ni?.value||"").trim();if(!name)return;
    const users=getUsers();
    if(users.includes(name)){alert("Name already taken!");return;}
    users.push(name);setUsers(users);
    USER=name;S.party=[];S.caught=[];S.seen=[];S.balls=20;
    S.screen="title";render();
  };
  on("badduser",addUser);
  if(ni)ni.addEventListener("keydown",e=>{if(e.key==="Enter")addUser();});

  // Nav
  on("bnew",()=>{S.screen="starter";render();});
  on("bhub",()=>{S.levelUpData=null;S.screen="hub";render();});
  on("bswitch",()=>{S.screen="users";render();});
  on("bswitchuser",()=>{S.screen="users";render();});
  on("bparty",()=>{S.screen="party";render();});
  on("bdex",()=>{S.screen="dex";render();});
  on("bshop",()=>{S.screen="shop";render();});
  on("bchooseLead",()=>{S.switchCtx="hub";S.screen="switch";render();});
  on("bswitchbattle",()=>{S.switchCtx="battle";S.screen="switch";render();});

  // Starters
  STARTERS.forEach(p=>{
    on("st"+p.id,()=>{
      S.party=[{...p,currentHP:p.maxHP,level:5,xp:0}];
      S.caught=[p.id];S.seen=[p.id];saveAll();S.screen="hub";render();
    });
  });

  // Battle
  on("batk",doAtk);
  on("bcatch",doCatch);
  on("brun",doRun);
  on("bheal",doHeal);

  // Catch fainted wild
  on("bcatchfainted",()=>{
    if(!S.wild||S.balls<=0)return;
    S.balls--;
    if(!S.caught.includes(S.wild.id))S.caught.push(S.wild.id);
    if(!S.seen.includes(S.wild.id))S.seen.push(S.wild.id);
    if(S.party.length<6)S.party.push({...S.wild,currentHP:0,xp:0,level:S.wild.level||5});
    addLog(`🎉 Caught ${S.wild.name}! (Heal before battle)`);
    saveAll();render();
  });

  // Evolve
  on("bevolve",doEvolve);
  on("bcancelevo",()=>{
    if(S.pendingEvo)addLog(`❌ ${S.pendingEvo.fromName} did not evolve.`);
    S.pendingEvo=null;S.levelUpData=null;S.screen="hub";render();
  });

  // Switch
  document.querySelectorAll(".swbtn").forEach(btn=>{
    btn.addEventListener("click",()=>doSwitch(parseInt(btn.dataset.idx)));
  });

  // Party release
  document.querySelectorAll(".relbtn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=parseInt(btn.dataset.idx);
      if(!confirm("Release "+S.party[i].name+"?"))return;
      S.party.splice(i,1);sv("party",S.party);render();
    });
  });

  // Shop
  on("bget3",()=>{S.balls+=3;sv("balls",S.balls);render();});
  on("bget10",()=>{S.balls+=10;sv("balls",S.balls);render();});

  // Reset
  on("breset",()=>{
    if(!confirm("Reset "+USER+"'s save?"))return;
    S.party=[];S.caught=[];S.seen=[];S.balls=20;saveAll();S.screen="title";render();
  });
}

// ── BOOT ──────────────────────────────────────────────────────
render();
</script>
